name: Build and Publish

on:
  workflow_dispatch:

  push:
    tags:
      - 'v*'

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, zip
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare Laravel
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Run tests
        run: php artisan test


  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate Docker tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/fgonzalez
          tags: |
            type=ref,event=tag
            type=sha,format=long,prefix=sha-
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .docker/Dockerfile.prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "DOCKERHUB_USERNAME='$DOCKERHUB_USERNAME' IMAGE_TAG='$IMAGE_TAG' bash -s" <<'REMOTE'
          set -e

          IMAGE="$DOCKERHUB_USERNAME/fgonzalez:$IMAGE_TAG"

          echo "Descargando nueva imagen..."
          docker pull "$IMAGE"

          echo "Preparando reemplazo con rollback..."

          docker rm -f fgonzalez-rollback >/dev/null 2>&1 || true

          OLD_IMAGE=""

          if docker inspect fgonzalez >/dev/null 2>&1; then
              OLD_IMAGE=$(docker inspect fgonzalez --format='{{.Config.Image}}')
              echo "Versión anterior: $OLD_IMAGE"

              docker stop fgonzalez
              docker rename fgonzalez fgonzalez-rollback
          else
              echo "No existe una versión anterior."
          fi

          echo "Levantando nueva versión..."

          if ! docker run -d \
              --name fgonzalez \
              -p 39879:80 \
              -v "$HOME/fgonzalez/.env:/var/www/html/.env:ro" \
              -v "$HOME/fgonzalez/database/database.sqlite:/var/www/html/database/database.sqlite" \
              "$IMAGE"
          then
              echo "No fue posible iniciar la nueva versión."

              if docker inspect fgonzalez-rollback >/dev/null 2>&1; then
                  echo "Restaurando versión anterior..."
                  docker rename fgonzalez-rollback fgonzalez
                  docker start fgonzalez
              fi

              exit 1
          fi

          echo "Comprobando nueva versión..."

          DEPLOY_OK=false

          for i in $(seq 1 20); do
              if curl -fsS http://127.0.0.1:39879/ >/dev/null; then
                  DEPLOY_OK=true
                  break
              fi

              echo "Intento $i/20: aplicación todavía no disponible..."
              sleep 2
          done

          if [ "$DEPLOY_OK" = "true" ]; then
              echo "Nueva versión saludable."

              docker rm fgonzalez-rollback >/dev/null 2>&1 || true

              echo "Deploy completado correctamente con imagen: $IMAGE"
              exit 0
          fi

          echo "La nueva versión no respondió correctamente."
          echo "Logs de la nueva versión:"
          docker logs --tail 100 fgonzalez || true

          echo "Iniciando rollback..."

          docker rm -f fgonzalez

          if docker inspect fgonzalez-rollback >/dev/null 2>&1; then
              docker rename fgonzalez-rollback fgonzalez
              docker start fgonzalez

              echo "Comprobando versión restaurada..."

              for i in $(seq 1 20); do
                  if curl -fsS http://127.0.0.1:39879/ >/dev/null; then
                      echo "Rollback completado correctamente a: $OLD_IMAGE"
                      exit 1
                  fi

                  sleep 2
              done

              echo "CRÍTICO: el rollback tampoco respondió."
              exit 1
          fi

          echo "No existe contenedor anterior para rollback."
          exit 1
          REMOTE
          "